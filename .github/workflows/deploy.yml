name: Deploy to Alibaba Cloud

on:
  push:
    branches: [ v2, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global http.version HTTP/1.1
            # Ensure ffmpeg is available. Try system package manager first, then
            # fall back to a static binary in /opt/bili-summary/bin/ffmpeg.
            # We never let this block fail the whole deploy (||true at the end).
            FFMPEG_DIR="/opt/bili-summary/bin"
            FFMPEG_BIN="$FFMPEG_DIR/ffmpeg"
            install_ffmpeg() {
              if command -v ffmpeg >/dev/null 2>&1; then
                FFMPEG_BIN="$(command -v ffmpeg)"
                echo "ffmpeg already on PATH: $FFMPEG_BIN"
                return 0
              fi
              if [ -x "$FFMPEG_BIN" ]; then
                echo "Reusing existing static ffmpeg: $FFMPEG_BIN"
                return 0
              fi
              echo "Installing ffmpeg via package manager..."
              if command -v apt-get >/dev/null 2>&1; then
                DEBIAN_FRONTEND=noninteractive apt-get update -y && \
                  DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg && \
                  FFMPEG_BIN="$(command -v ffmpeg)" && return 0
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y epel-release || true
                dnf install -y ffmpeg && FFMPEG_BIN="$(command -v ffmpeg)" && return 0
              elif command -v yum >/dev/null 2>&1; then
                yum install -y epel-release || true
                yum install -y ffmpeg && FFMPEG_BIN="$(command -v ffmpeg)" && return 0
              fi
              echo "Package manager install failed; trying static binary download..."
              mkdir -p "$FFMPEG_DIR"
              TMPDIR=$(mktemp -d)
              ARCH=$(uname -m)
              case "$ARCH" in
                x86_64|amd64) FF_TARBALL="ffmpeg-release-amd64-static.tar.xz" ;;
                aarch64|arm64) FF_TARBALL="ffmpeg-release-arm64-static.tar.xz" ;;
                *) echo "Unsupported arch: $ARCH"; return 1 ;;
              esac
              curl --max-time 180 -fsSL -o "$TMPDIR/ffmpeg.tar.xz" \
                "https://johnvansickle.com/ffmpeg/releases/$FF_TARBALL" || return 1
              tar -xf "$TMPDIR/ffmpeg.tar.xz" -C "$TMPDIR" || return 1
              FF_EXTRACTED=$(find "$TMPDIR" -maxdepth 1 -type d -name 'ffmpeg-*-static' | head -n1)
              cp "$FF_EXTRACTED/ffmpeg" "$FFMPEG_BIN" && chmod +x "$FFMPEG_BIN"
              rm -rf "$TMPDIR"
            }
            install_ffmpeg || echo "WARN: ffmpeg install failed; whisper transcription will not work"
            ("$FFMPEG_BIN" -version | head -n1) || true
            REPO_DIR="/opt/bili-summary"
            PROJ_DIR="$REPO_DIR/bili-summary-ts"

            # Create .env if missing
            if [ ! -f "$REPO_DIR/.env" ]; then
              KEY=$(openssl rand -hex 32)
              echo "ENCRYPTION_KEY=$KEY" > "$REPO_DIR/.env"
              echo "PORT=8080" >> "$REPO_DIR/.env"
              echo "Created .env with new ENCRYPTION_KEY"
            fi

            # Update code
            if [ -d "$PROJ_DIR" ]; then
              cd "$PROJ_DIR"
              git fetch origin
              git reset --hard origin/v2
              git clean -fd
            else
              git clone -b v2 https://github.com/yidongxie/bili-summary-ts.git "$REPO_DIR"
              cd "$PROJ_DIR"
            fi

            npm install
            npx tsc
            node /opt/bili-summary/bili-summary-ts/deploy-migrate.js


            # Start fresh (PM2 restart keeps old env, so delete + start)
            source "$REPO_DIR/.env"
            pm2 delete bilistudy 2>/dev/null || true
            ENCRYPTION_KEY=$ENCRYPTION_KEY FFMPEG_PATH=$FFMPEG_BIN pm2 start dist/index.js --name bilistudy
            pm2 save

            echo "=== Verify ==="
            sleep 2
            curl -s http://127.0.0.1:8080/health && echo " - OK" || echo "Health check FAILED"
            ss -tlnp | grep 8080 || echo "Port 8080 not listening"
