name: Deploy to Alibaba Cloud

on:
  push:
    branches: [ v2, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack application
        run: |
          set -e
          cd bili-summary-ts
          tar \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./data' \
            --exclude='./logs' \
            -czf ../bili-summary-release.tgz .

      - name: Upload release bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          source: bili-summary-release.tgz
          target: /tmp/bili-summary-deploy
          overwrite: true

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            echo "=== STEP: probe ffmpeg ==="
            # One-shot installer: if ffmpeg is not on the host yet, install it.
            if ! command -v ffmpeg >/dev/null 2>&1 && [ ! -x "/opt/bili-summary/bin/ffmpeg" ]; then
              echo "=== STEP: install ffmpeg (one-shot) ==="
              if command -v apt-get >/dev/null 2>&1; then
                (apt-get update -y && apt-get install -y ffmpeg) || true
              fi
              if ! command -v ffmpeg >/dev/null 2>&1 && command -v dnf >/dev/null 2>&1; then
                (dnf install -y epel-release || true; dnf install -y ffmpeg) || true
              fi
              if ! command -v ffmpeg >/dev/null 2>&1 && command -v yum >/dev/null 2>&1; then
                (yum install -y epel-release || true; yum install -y ffmpeg) || true
              fi
              if ! command -v ffmpeg >/dev/null 2>&1; then
                echo "Pkg manager failed; trying static binary from Aliyun mirror"
                mkdir -p /opt/bili-summary/bin /tmp/ffstatic && cd /tmp/ffstatic
                # Aliyun OSS-hosted static build (CN-friendly). Falls back to johnvansickle.
                curl -fL --connect-timeout 20 -o ff.tar.xz \
                  "https://mirrors.aliyun.com/zabbix/agent2plugins/ffmpeg-release-amd64-static.tar.xz" \
                  || curl -fL --connect-timeout 20 -o ff.tar.xz \
                  "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
                tar xf ff.tar.xz
                cp ffmpeg-*/ffmpeg /opt/bili-summary/bin/ffmpeg
                chmod +x /opt/bili-summary/bin/ffmpeg
                cd /
              fi
            fi
            # ffmpeg is installed manually on the host. Pick it up from PATH or
            # the well-known /opt/bili-summary/bin/ffmpeg location.
            if command -v ffmpeg >/dev/null 2>&1; then
              FFMPEG_BIN="$(command -v ffmpeg)"
            elif [ -x "/opt/bili-summary/bin/ffmpeg" ]; then
              FFMPEG_BIN="/opt/bili-summary/bin/ffmpeg"
            else
              FFMPEG_BIN=""
              echo "WARN: no ffmpeg found on host; whisper will fail until installed."
            fi
            [ -n "$FFMPEG_BIN" ] && ("$FFMPEG_BIN" -version | head -n1 || true)
            REPO_DIR="/opt/bili-summary"
            PROJ_DIR="$REPO_DIR/bili-summary-ts"

            echo "=== STEP: ensure .env ==="
            # Create .env if missing
            if [ ! -f "$REPO_DIR/.env" ]; then
              KEY=$(openssl rand -hex 32)
              echo "ENCRYPTION_KEY=$KEY" > "$REPO_DIR/.env"
              echo "PORT=8080" >> "$REPO_DIR/.env"
              echo "Created .env with new ENCRYPTION_KEY"
            fi

            echo "=== STEP: update code ==="
            mkdir -p "$PROJ_DIR"
            cd "$PROJ_DIR"
            find . -mindepth 1 \
              ! -path './data' ! -path './data/*' \
              ! -path './node_modules' ! -path './node_modules/*' \
              ! -path './dist' ! -path './dist/*' \
              -exec rm -rf {} +
            tar -xzf /tmp/bili-summary-deploy/bili-summary-release.tgz -C "$PROJ_DIR"

            echo "=== STEP: npm install ==="
            npm install --no-audit --no-fund
            echo "=== STEP: tsc ==="
            npx tsc
            echo "=== STEP: migrate ==="
            node /opt/bili-summary/bili-summary-ts/deploy-migrate.js


            echo "=== STEP: pm2 restart ==="
            # Start fresh (PM2 restart keeps old env, so delete + start)
            source "$REPO_DIR/.env"
            pm2 delete bilistudy 2>/dev/null || true
            ENCRYPTION_KEY=$ENCRYPTION_KEY FFMPEG_PATH=$FFMPEG_BIN pm2 start dist/index.js --name bilistudy
            pm2 save

            echo "=== Verify ==="
            sleep 2
            curl -s http://127.0.0.1:8080/health && echo " - OK" || echo "Health check FAILED"
            ss -tlnp | grep 8080 || echo "Port 8080 not listening"
