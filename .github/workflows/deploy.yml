name: Deploy to Alibaba Cloud

on:
  push:
    branches: [ v2, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pack application
        run: |
          set -e
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.claude' \
            --exclude='./_backup_local' \
            --exclude='./node_modules' \
            --exclude='./data' \
            --exclude='./dist' \
            --exclude='./public/dist' \
            --exclude='./logs' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./bili-summary-ts/node_modules' \
            --exclude='./bili-summary-ts/data' \
            --exclude='./bili-summary-ts/dist' \
            --exclude='./bili-summary-ts/public/dist' \
            --exclude='./bili-summary-ts/logs' \
            -czf /tmp/bili-summary-release.tgz .
          mv /tmp/bili-summary-release.tgz bili-summary-release.tgz

      - name: Upload release bundle
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          source: bili-summary-release.tgz
          target: /tmp/bili-summary-deploy
          overwrite: true

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            echo "=== STEP: probe ffmpeg ==="
            # One-shot installer: if ffmpeg is not on the host yet, install it.
            if ! command -v ffmpeg >/dev/null 2>&1 && [ ! -x "/opt/bili-summary/bin/ffmpeg" ]; then
              echo "=== STEP: install ffmpeg (one-shot) ==="
              if command -v apt-get >/dev/null 2>&1; then
                (apt-get update -y && apt-get install -y ffmpeg) || true
              fi
              if ! command -v ffmpeg >/dev/null 2>&1 && command -v dnf >/dev/null 2>&1; then
                (dnf install -y epel-release || true; dnf install -y ffmpeg) || true
              fi
              if ! command -v ffmpeg >/dev/null 2>&1 && command -v yum >/dev/null 2>&1; then
                (yum install -y epel-release || true; yum install -y ffmpeg) || true
              fi
              if ! command -v ffmpeg >/dev/null 2>&1; then
                echo "Pkg manager failed; trying static binary from Aliyun mirror"
                mkdir -p /opt/bili-summary/bin /tmp/ffstatic && cd /tmp/ffstatic
                curl -fL --connect-timeout 20 -o ff.tar.xz \
                  "https://mirrors.aliyun.com/zabbix/agent2plugins/ffmpeg-release-amd64-static.tar.xz" \
                  || curl -fL --connect-timeout 20 -o ff.tar.xz \
                  "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
                tar xf ff.tar.xz
                cp ffmpeg-*/ffmpeg /opt/bili-summary/bin/ffmpeg
                chmod +x /opt/bili-summary/bin/ffmpeg
                cd /
              fi
            fi
            # ffmpeg is installed manually on the host. Pick it up from PATH or
            # the well-known /opt/bili-summary/bin/ffmpeg location.
            if command -v ffmpeg >/dev/null 2>&1; then
              FFMPEG_BIN="$(command -v ffmpeg)"
            elif [ -x "/opt/bili-summary/bin/ffmpeg" ]; then
              FFMPEG_BIN="/opt/bili-summary/bin/ffmpeg"
            else
              FFMPEG_BIN=""
              echo "WARN: no ffmpeg found on host; whisper will fail until installed."
            fi
            [ -n "$FFMPEG_BIN" ] && ("$FFMPEG_BIN" -version | head -n1 || true)

            echo "=== STEP: install yt-dlp (one-shot) ==="
            YT_DLP_VERSION="2026.03.17"
            mkdir -p /opt/bili-summary/bin
            CURRENT_YT_DLP=""
            if [ -x "/opt/bili-summary/bin/yt-dlp" ]; then
              CURRENT_YT_DLP="$(/opt/bili-summary/bin/yt-dlp --version 2>/dev/null || true)"
            fi
            if [ "$CURRENT_YT_DLP" != "$YT_DLP_VERSION" ]; then
              echo "Installing yt-dlp ${YT_DLP_VERSION} (for Douyin, Xiaohongshu, YouTube support)..."
              # Use GitHub mirror for faster download in China
              curl -fL --connect-timeout 30 -o /opt/bili-summary/bin/yt-dlp \
                "https://mirror.ghproxy.com/https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/yt-dlp" \
                || curl -fL --connect-timeout 30 -o /opt/bili-summary/bin/yt-dlp \
                "https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/yt-dlp"
              chmod +x /opt/bili-summary/bin/yt-dlp
              echo "yt-dlp installed successfully"
            fi
            if [ -x "/opt/bili-summary/bin/yt-dlp" ]; then
              YT_DLP_BIN="/opt/bili-summary/bin/yt-dlp"
            elif command -v yt-dlp >/dev/null 2>&1; then
              YT_DLP_BIN="$(command -v yt-dlp)"
            else
              YT_DLP_BIN=""
              echo "WARN: no yt-dlp found on host; Douyin/Xiaohongshu/YouTube may fail"
            fi
            [ -n "$YT_DLP_BIN" ] && ("$YT_DLP_BIN" --version || true)

            echo "=== STEP: install douyin-downloader sidecar ==="
            if command -v python3 >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -y && apt-get install -y python3-venv python3-pip || true
              fi
              mkdir -p /opt/bili-summary/tools /opt/bili-summary/douyin-downloader/Downloaded
              if [ ! -d "/opt/bili-summary/tools/douyin-downloader/.git" ]; then
                git clone --depth 1 https://github.com/jiji262/douyin-downloader.git /opt/bili-summary/tools/douyin-downloader || true
              else
                git -C /opt/bili-summary/tools/douyin-downloader pull --ff-only || true
              fi
              cd /opt/bili-summary/tools/douyin-downloader
              python3 -m venv .venv || { echo "WARN: python3 venv unavailable; Douyin fallback sidecar disabled"; cd /; }
              if [ -x ".venv/bin/pip" ]; then
                .venv/bin/pip install --upgrade pip || true
                .venv/bin/pip install -r requirements.txt fastapi uvicorn || true
              fi
              cat > /opt/bili-summary/douyin-downloader/config.yml <<'EOF'
            link: []
            path: /opt/bili-summary/douyin-downloader/Downloaded/
            music: false
            cover: false
            avatar: false
            json: true
            folderstyle: true
            filename_template: "{date}_{title}_{id}"
            folder_template: "{date}_{title}_{id}"
            author_dir: "nickname"
            mode:
              - post
            number:
              post: 1
            thread: 2
            retry_times: 3
            proxy: ""
            database: false
            progress:
              quiet_logs: true
            server:
              max_jobs: 100
              job_ttl_seconds: 86400
            cookies:
              msToken: ""
              ttwid: ""
              odin_tt: ""
              passport_csrf_token: ""
              sid_guard: ""
            EOF
            else
              echo "WARN: python3 not found; Douyin fallback sidecar disabled"
            fi

            REPO_DIR="/opt/bili-summary"
            PROJ_DIR="$REPO_DIR/bili-summary-ts"

            echo "=== STEP: ensure .env ==="
            # Create .env if missing
            if [ ! -f "$REPO_DIR/.env" ]; then
              KEY=$(openssl rand -hex 32)
              SESSION_KEY=$(openssl rand -hex 32)
              echo "ENCRYPTION_KEY=$KEY" > "$REPO_DIR/.env"
              echo "SESSION_SECRET=$SESSION_KEY" >> "$REPO_DIR/.env"
              echo "PORT=8080" >> "$REPO_DIR/.env"
              echo "NODE_ENV=production" >> "$REPO_DIR/.env"
              echo "BASE_URL=https://xydong.site" >> "$REPO_DIR/.env"
              echo "Created .env with new ENCRYPTION_KEY and SESSION_SECRET"
            fi
            if ! grep -q '^SESSION_SECRET=' "$REPO_DIR/.env"; then
              echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$REPO_DIR/.env"
              echo "Added SESSION_SECRET to existing .env"
            fi
            if ! grep -q '^NODE_ENV=' "$REPO_DIR/.env"; then
              echo "NODE_ENV=production" >> "$REPO_DIR/.env"
            fi
            if ! grep -q '^BASE_URL=' "$REPO_DIR/.env"; then
              echo "BASE_URL=https://xydong.site" >> "$REPO_DIR/.env"
            fi
            if ! grep -q '^DOUYIN_DOWNLOADER_API=' "$REPO_DIR/.env"; then
              echo "DOUYIN_DOWNLOADER_API=http://127.0.0.1:8765" >> "$REPO_DIR/.env"
            fi
            if ! grep -q '^DOUYIN_DOWNLOADER_OUTPUT_DIR=' "$REPO_DIR/.env"; then
              echo "DOUYIN_DOWNLOADER_OUTPUT_DIR=/opt/bili-summary/douyin-downloader/Downloaded" >> "$REPO_DIR/.env"
            fi
            # WeChat mini-program login — inject from GitHub Secrets
            if ! grep -q '^WECHAT_APPID=' "$REPO_DIR/.env"; then
              echo "WECHAT_APPID=${{ secrets.WECHAT_APPID }}" >> "$REPO_DIR/.env"
            fi
            if ! grep -q '^WECHAT_APPSECRET=' "$REPO_DIR/.env"; then
              echo "WECHAT_APPSECRET=${{ secrets.WECHAT_APPSECRET }}" >> "$REPO_DIR/.env"
            fi

            echo "=== STEP: update code ==="
            mkdir -p "$PROJ_DIR"
            cd "$PROJ_DIR"
            find . -mindepth 1 \
              ! -path './data' ! -path './data/*' \
              ! -path './node_modules' ! -path './node_modules/*' \
              ! -path './dist' ! -path './dist/*' \
              -exec rm -rf {} +
            tar -xzf /tmp/bili-summary-deploy/bili-summary-release.tgz -C "$PROJ_DIR"

            echo "=== STEP: npm install ==="
            # Prefer npm ci (strict, lockfile-driven) when package-lock.json
            # is shipped in the release bundle. Fall back to npm install for
            # legacy releases that don't include the lockfile yet.
            if [ -f package-lock.json ]; then
              npm ci --registry=https://registry.npmmirror.com --no-audit --no-fund
            else
              npm install --registry=https://registry.npmmirror.com --no-audit --no-fund
            fi
            echo "=== STEP: tsc ==="
            npx tsc
            echo "=== STEP: build web (vite) ==="
            # Builds web/ -> public/dist/. The Express server serves public/dist/
            # as the primary static dir (see src/index.ts).
            npm run build:web
            echo "=== STEP: migrate ==="
            node "$PROJ_DIR/deploy-migrate.js"

            echo "=== STEP: pm2 restart ==="
            # Start fresh (PM2 restart keeps old env, so delete + start)
            source "$REPO_DIR/.env"
            pm2 delete bilistudy 2>/dev/null || true
            pm2 delete douyin-downloader 2>/dev/null || true
            if [ -x "/opt/bili-summary/tools/douyin-downloader/.venv/bin/python" ]; then
              cd /opt/bili-summary/tools/douyin-downloader
              pm2 start .venv/bin/python --name douyin-downloader -- run.py --serve --serve-host 127.0.0.1 --serve-port 8765 --config /opt/bili-summary/douyin-downloader/config.yml || true
            fi
            cd "$PROJ_DIR"
            PATH="/opt/bili-summary/bin:$PATH" ENCRYPTION_KEY=$ENCRYPTION_KEY SESSION_SECRET=$SESSION_SECRET NODE_ENV=${NODE_ENV:-production} BASE_URL=${BASE_URL:-https://xydong.site} ADMIN_EMAIL=${ADMIN_EMAIL:-} FFMPEG_PATH=$FFMPEG_BIN YT_DLP_PATH=$YT_DLP_BIN YT_DLP_COOKIES_FILE=${YT_DLP_COOKIES_FILE:-} YT_DLP_BROWSER_COOKIES=${YT_DLP_BROWSER_COOKIES:-} DOUYIN_DOWNLOADER_API=${DOUYIN_DOWNLOADER_API:-http://127.0.0.1:8765} DOUYIN_DOWNLOADER_OUTPUT_DIR=${DOUYIN_DOWNLOADER_OUTPUT_DIR:-/opt/bili-summary/douyin-downloader/Downloaded} WECHAT_APPID=${{ secrets.WECHAT_APPID }} WECHAT_APPSECRET=${{ secrets.WECHAT_APPSECRET }} pm2 start dist/index.js --name bilistudy --max-memory-restart 1G
            pm2 save
            pm2 status bilistudy

            echo "=== Verify ==="
            sleep 2
            curl -fsS http://127.0.0.1:8080/health && echo " - OK"
            ss -tlnp | grep 8080
            # Confirm Vite build landed and is being served
            if [ -f "$PROJ_DIR/public/dist/index.html" ]; then
              echo "Web bundle present: $(ls -la $PROJ_DIR/public/dist/assets/ | head -3)"
            else
              echo "ERROR: public/dist/index.html missing — vite build did not run"
              exit 1
            fi
            # Verify yt-dlp available in PATH for the app
            if PATH="/opt/bili-summary/bin:$PATH" command -v yt-dlp >/dev/null 2>&1; then
              echo "yt-dlp available: $(PATH="/opt/bili-summary/bin:$PATH" yt-dlp --version)"
            else
              echo "WARN: yt-dlp not accessible from app PATH"
            fi
