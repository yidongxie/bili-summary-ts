name: Deploy to Alibaba Cloud

on:
  push:
    branches: [ v2, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global http.version HTTP/1.1
            # Ensure ffmpeg is installed (required by Whisper transcription)
            if ! command -v ffmpeg >/dev/null 2>&1; then
              echo "Installing ffmpeg..."
              if command -v apt-get >/dev/null 2>&1; then
                sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y ffmpeg || sudo dnf install -y epel-release && sudo dnf install -y ffmpeg
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y epel-release || true
                sudo yum install -y ffmpeg
              else
                echo "No supported package manager (apt/dnf/yum) found for ffmpeg install" >&2
                exit 1
              fi
            fi
            ffmpeg -version | head -n1
            REPO_DIR="/opt/bili-summary"
            PROJ_DIR="$REPO_DIR/bili-summary-ts"

            # Create .env if missing
            if [ ! -f "$REPO_DIR/.env" ]; then
              KEY=$(openssl rand -hex 32)
              echo "ENCRYPTION_KEY=$KEY" > "$REPO_DIR/.env"
              echo "PORT=8080" >> "$REPO_DIR/.env"
              echo "Created .env with new ENCRYPTION_KEY"
            fi

            # Update code
            if [ -d "$PROJ_DIR" ]; then
              cd "$PROJ_DIR"
              git fetch origin
              git reset --hard origin/v2
              git clean -fd
            else
              git clone -b v2 https://github.com/yidongxie/bili-summary-ts.git "$REPO_DIR"
              cd "$PROJ_DIR"
            fi

            npm install
            npx tsc
            node /opt/bili-summary/bili-summary-ts/deploy-migrate.js


            # Start fresh (PM2 restart keeps old env, so delete + start)
            source "$REPO_DIR/.env"
            pm2 delete bilistudy 2>/dev/null || true
            ENCRYPTION_KEY=$ENCRYPTION_KEY pm2 start dist/index.js --name bilistudy
            pm2 save

            echo "=== Verify ==="
            sleep 2
            curl -s http://127.0.0.1:8080/health && echo " - OK" || echo "Health check FAILED"
            ss -tlnp | grep 8080 || echo "Port 8080 not listening"
