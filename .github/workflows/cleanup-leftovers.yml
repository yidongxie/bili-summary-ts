name: Cleanup leftovers

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove leftover files
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            rm -rf /opt/bili-summary/DEPLOY.md /opt/bili-summary/tests
            echo "=== /opt/bili-summary now ==="
            ls -la /opt/bili-summary/
            echo "=== DONE ==="
