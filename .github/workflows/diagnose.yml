name: Diagnose server data

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect all sqlite databases (read-only)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "===== locating all bilistudy.sqlite files ====="
            for f in $(find / -name "bilistudy.sqlite" 2>/dev/null); do
              echo
              echo "######## DB PATH: $f ########"
              ls -la "$f" 2>/dev/null
              ls -la "$f-wal" "$f-shm" 2>/dev/null || true
              NODE_MOD="/opt/bili-summary/bili-summary-ts/node_modules/better-sqlite3"
              if [ -d "$NODE_MOD" ]; then
                node -e '
                  const Database = require("/opt/bili-summary/bili-summary-ts/node_modules/better-sqlite3");
                  let db;
                  try {
                    db = new Database(process.argv[1], { readonly: true, fileMustExist: true });
                  } catch (e) { console.log("OPEN ERR:", e.message); process.exit(0); }
                  try {
                    const users = db.prepare("SELECT COUNT(*) c FROM users").get();
                    const items = db.prepare("SELECT COUNT(*) c FROM library_items").get();
                    console.log("users =", users.c, "| library_items =", items.c);
                    const u = db.prepare("SELECT id, email, display_name, created_at FROM users ORDER BY id LIMIT 20").all();
                    console.log("USERS:", JSON.stringify(u));
                    const it = db.prepare("SELECT id, title, created_at FROM library_items ORDER BY created_at DESC LIMIT 8").all();
                    console.log("ITEMS:", JSON.stringify(it));
                  } catch (e) { console.log("QUERY ERR:", e.message); }
                  db.close();
                ' "$f"
              else
                echo "(better-sqlite3 module not found)"
              fi
            done
            echo
            echo "===== recycle bin top-level listing ====="
            find /.Recycle_bin -maxdepth 3 -name "*.sqlite*" 2>/dev/null || true
            echo "===== DONE ====="
