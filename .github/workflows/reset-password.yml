name: Reset admin password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Force-set admin password to secret value
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd /opt/bili-summary/bili-summary-ts
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" node -e '
              const Database = require("./node_modules/better-sqlite3");
              const crypto = require("crypto");
              const db = new Database("./data/bilistudy.sqlite");
              const pwd = process.env.ADMIN_PASSWORD || "";
              if (!pwd || pwd.length < 12) { console.log("SKIP: ADMIN_PASSWORD missing/short"); process.exit(0); }
              const salt = crypto.randomBytes(16).toString("hex");
              const hash = crypto.pbkdf2Sync(pwd, salt, 100000, 64, "sha512").toString("hex");
              const row = db.prepare("SELECT id FROM users WHERE email = ?").get("444925817@qq.com");
              if (!row) { console.log("admin user not found"); process.exit(1); }
              db.prepare("UPDATE user_configs SET password_hash = ? WHERE user_id = ?").run(salt + ":" + hash, row.id);
              console.log("Admin password reset for user id=" + row.id);
              db.close();
            '
            echo "=== DONE ==="
