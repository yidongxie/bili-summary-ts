<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiliStudy V2 - B站学习库</title>
<style>

*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#eef2f7;color:#172033}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#111827;color:#e5e7eb;padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.main{padding:28px;max-width:1180px}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:650;color:#475569;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid #dbe3ef;background:#f8fafc;border-radius:7px;padding:10px 11px;color:#172033;outline:none}
.btn{padding:10px 14px;border-radius:7px;background:#e2e8f0;color:#172033;font-weight:650;min-height:40px;border:0;cursor:pointer}
.btn.primary{background:#2563eb;color:#fff}
.status{display:none;margin-top:12px;padding:10px 12px;border-radius:7px;font-size:13px}
.status.show{display:block} .status.info{background:#eff6ff;color:#1d4ed8} .status.error{background:#fef2f2;color:#b91c1c} .status.ok{background:#f0fdf4;color:#15803d}
.page{display:none} .page.active{display:block}

</style></head><body>
<div class="app">
<aside class="sidebar"><div class="brand"><h2>BiliStudy</h2></div>
<nav>
<button class="active" data-page="summaryPage" onclick="showPage('summaryPage')">总结</button>
<button data-page="libraryPage" onclick="showPage('libraryPage');loadLibrary();">收藏库</button>
<button data-page="settingsPage" onclick="showPage('settingsPage')">设置</button>
</nav>
<div id="userArea" style="margin-top:auto;padding:12px;background:rgba(255,255,255,.08);border-radius:8px;display:none;">
<span id="userName" style="font-size:13px;"></span>
<button onclick="logout()" style="margin-left:8px;font-size:11px;">退出</button>
</div>
<button id="loginBtn" onclick="login()" style="display:flex;align-items:center;gap:8px;justify-content:center;padding:10px;background:#24292f;color:#fff;border-radius:8px;font-weight:700;">GitHub 登录</button>
</aside>
<main class="main">
<section id="summaryPage" class="page active">
<h1>总结视频</h1>
<p>粘贴 B站链接，生成学习笔记。</p>
<div class="panel">
<div class="field"><label>B站视频链接</label><input id="urlInput" placeholder="https://www.bilibili.com/video/BV..." autofocus></div>
<div style="display:flex;gap:8px;margin-top:10px;align-items:end;">
<select id="modeInput" style="padding:10px;border:1px solid #dbe3ef;border-radius:7px;background:#f8fafc;">
<option value="brief">简洁总结</option><option value="detailed">详细笔记</option><option value="timeline">时间线</option><option value="knowledge">知识卡片</option>
</select>
<button class="btn primary" id="summarizeBtn" onclick="startSummarize()">开始总结</button>
</div>
<div id="status" class="status"></div>
</div>
<div id="resultPanel" class="page" style="display:none;">
<div id="progressOverlay" class="panel" style="text-align:center;padding:40px;display:none;">
<div style="width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;"></div>
<div id="progressText" style="color:#64748b;">正在处理…</div>
<div id="progressError" style="color:#b91c1c;margin-top:12px;display:none;"></div>
</div>
<div id="resultContent" style="display:none;">
<div class="panel"><button onclick="backToInput()">返回</button> <span id="resultTitle"></span>
<div id="videoMeta"></div>
<div id="videoEmbedWrap"></div>
<div id="summaryContent" class="summary"></div>
</div>
<div id="transcriptTimeline" class="panel"></div>
</div>
</div>
</section>
<section id="libraryPage" class="page"><div id="libraryCards"></div></section>
<section id="settingsPage" class="page">
<h1>设置</h1>
<div class="panel"><label>API Key</label><input type="password" id="apiKeyInput" placeholder="sk-..."><span id="apiKeyStatus" style="font-size:12px;color:#64748b;"></span></div>
<div class="panel"><label>Whisper API Key</label><input type="password" id="whisperApiKeyInput" placeholder="sk-..."><span id="whisperKeyStatus" style="font-size:12px;color:#64748b;"></span></div>
<div class="panel"><label>SESSDATA</label><input id="sessdataInput" placeholder="从浏览器 Cookie 复制"><span id="sessdataStatus" style="font-size:12px;color:#64748b;"></span></div>
<button class="btn primary" onclick="saveConfig()">保存设置</button>
<div id="settingsStatus" class="status"></div>
</section>
</main></div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
let appConfig = {};
let currentResult = null;
let currentTaskId = null;
let selectedTagSet = new Set();

async function api(path, opts) {
  opts = opts || {};
  const r = await fetch(path, opts);
  const c = r.headers.get('content-type') || '';
  const d = c.includes('application/json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error(d.error || d || r.statusText);
  return d;
}

function $(id) { return document.getElementById(id); }

function show(id, msg, type) {
  const el = $(id);
  el.className = 'status show ' + type;
  el.textContent = msg;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t == null ? '' : String(t);
  return d.innerHTML;
}

function fmtDur(s) {
  s = Number(s || 0);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const x = s % 60;
  return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0') : m + ':' + String(x).padStart(2,'0');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === id));
}

async function checkAuth() {
  try {
    const d = await api('/api/auth/me');
    if (d.authenticated && d.user) {
      const ua = $('userArea');
      ua.style.display = 'block';
      ua.innerHTML = '<span style="font-size:13px;">' + escapeHtml(d.user.display_name) + '</span><button onclick="logout()" style="margin-left:8px;font-size:11px;">退出</button>';
      $('loginBtn').style.display = 'none';
      document.querySelectorAll('.nav button').forEach(b => b.disabled = false);
      await loadConfig();
      return true;
    }
  } catch {}
  $('userArea').style.display = 'none';
  $('loginBtn').style.display = 'flex';
  document.querySelectorAll('.nav button').forEach(b => { if (b.dataset.page !== 'summaryPage') b.disabled = true; });
  return false;
}

function login() { window.location.href = '/api/auth/github'; }
async function logout() { await api('/api/auth/logout', {method:'POST'}); window.location.reload(); }

async function loadConfig() {
  const d = await api('/api/config');
  appConfig = d.config || {};
  const c = d.config || {};
  const ak = $('apiKeyStatus'); if (ak) ak.textContent = c.api_key_set ? '\u2713 已设置' : '未设置';
  const wk = $('whisperKeyStatus'); if (wk) wk.textContent = c.whisper_api_key_set ? '\u2713 已设置' : '未设置';
  const sk = $('sessdataStatus'); if (sk) sk.textContent = c.bili_sessdata_set ? '\u2713 已设置' : '未设置';
}

async function saveConfig() {
  const p = {
    api_key: $('apiKeyInput').value.trim(),
    bili_sessdata: $('sessdataInput').value.trim(),
    whisper_api_key: $('whisperApiKeyInput').value.trim(),
  };
  await api('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p)});
  await loadConfig();
  show('settingsStatus', '设置已保存', 'ok');
}

async function startSummarize() {
  const url = $('urlInput').value.trim();
  if (!url) return show('status', '请输入视频链接', 'error');
  const btn = $('summarizeBtn');
  btn.disabled = true;
  show('status', '正在提交任务…', 'info');
  try {
    const d = await api('/api/tasks/summarize', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url, mode: $('modeInput').value, use_whisper: false})});
    if (!d.success) throw new Error(d.error || '提交失败');
    if (!d.task_id) throw new Error('未获取到任务 ID');
    $('resultPanel').style.display = 'block';
    $('progressOverlay').style.display = 'block';
    $('resultContent').style.display = 'none';
    $('progressText').textContent = '正在处理…';
    $('progressError').style.display = 'none';
    currentTaskId = d.task_id;
    listenSSE(d.task_id);
  } catch (err) {
    show('status', err.message, 'error');
    btn.disabled = false;
  }
}

function listenSSE(taskId) {
  const es = new EventSource('/api/tasks/' + encodeURIComponent(taskId) + '/events');
  es.addEventListener('status', function(e) {
    const d = JSON.parse(e.data);
    $('progressText').textContent = d.progress || '处理中…';
  });
  es.addEventListener('complete', function(e) {
    const d = JSON.parse(e.data);
    es.close();
    currentTaskId = null;
    $('progressOverlay').style.display = 'none';
    $('resultContent').style.display = 'block';
    $('summarizeBtn').disabled = false;
    currentResult = d;
    renderResult(d);
    var el = $('transcriptTimeline');
    el.innerHTML = d.subtitle_count ? d.subtitle_count + '\u6761\u5b57\u5e55' : '\u65e0\u5b57\u5e55';
    show('status', '完成: ' + (d.summary ? d.summary.slice(0, 60) + '…' : ''), 'ok');
  });
  es.addEventListener('error', function(e) {
    try { const d = JSON.parse(e.data); $('progressError').textContent = d.error || '处理出错'; } catch { $('progressError').textContent = '处理出错'; }
    $('progressError').style.display = 'block';
    es.close();
    currentTaskId = null;
    $('summarizeBtn').disabled = false;
  });
  es.onerror = function() {
    if (currentTaskId) { es.close(); currentTaskId = null; $('summarizeBtn').disabled = false; show('status', '连接中断', 'error'); }
  };
}

function renderResult(data) {
  const v = data.video;
  $('resultTitle').textContent = v.title || '视频总结';
  $('videoMeta').innerHTML = '<p><strong>' + escapeHtml(v.title) + '</strong> by ' + escapeHtml(v.author) + ' \u00b7 ' + fmtDur(v.duration) + '</p>';
  $('videoEmbedWrap').innerHTML = '<div style="position:relative;width:100%;padding-bottom:56.25%;background:#000;overflow:hidden;border-radius:8px;"><iframe src="https://player.bilibili.com/player.html?bvid=' + v.bvid + '&autoplay=0&high_quality=1" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;"></iframe></div>';
  var md = data.summary || '';
  var h = escapeHtml(md).replace(/\n/g, '<br>');
  $('summaryContent').innerHTML = '<p>' + h + '</p>';
}

function backToInput() {
  $('resultPanel').style.display = 'none';
  $('urlInput').focus();
}

window.addEventListener('DOMContentLoaded', async function() {
  await checkAuth();
});
</script>
</body></html>
